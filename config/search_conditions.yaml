# ── 검색 키워드 ─────────────────────────────────────────────
# 항목 중 하나라도 직위명/설명에 포함되면 결과에 포함됩니다.
# 추가/삭제/수정 자유롭게 가능합니다.
keywords:
  - "political science"
  - "international relations"
  - "social science"
  - "public administration"
  - "political affairs"
  - "governance"
  - "peacebuilding"
  - "policy analyst"
  - "research officer"
  - "humanitarian"


# ── 근무지 필터 ─────────────────────────────────────────────
# 공고의 근무지가 아래 목록 중 하나와 일치하면 포함됩니다.
# 대소문자 무시. 비워두면 (locations: []) 모든 근무지 포함.
locations:
  - "United Kingdom"
  - "London"
  - "UK"
  # - "Geneva"     # 추가 예시
  # - "New York"   # 추가 예시


# ── 카테고리 필터 ────────────────────────────────────────────
# 비워두면 모든 카테고리 포함
categories: []


# ── 마감일 필터 ──────────────────────────────────────────────
# 오늘로부터 N일 이내 마감 공고만 포함. 0이면 필터 없음.
deadline_within_days: 60


# ── 출력 설정 ────────────────────────────────────────────────
output:
  filename_prefix: "jobs"
  keep_last_days: 30
  timezone: "Asia/Seoul"


# ── 알림 설정 ────────────────────────────────────────────────
notifications:
  email:
    enabled: false
    to: "your@email.com"
  slack:
    enabled: false
    mention_on_new: true
