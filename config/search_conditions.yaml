# ╔══════════════════════════════════════════════════════╗
# ║              🔍  검색 키워드 설정                     ║
# ╚══════════════════════════════════════════════════════╝

# ── 영어 키워드 (UK 사이트 + KR 사이트 영문 검색 공통 사용) ──────
keywords:
  - "political science"
  - "international relations"
  - "social science"
  - "public administration"
  - "political affairs"
  - "governance"
  - "peacebuilding"
  - "policy analyst"
  - "research officer"
  - "humanitarian"
  - "international development"
  - "ODA"


# ── 한국어 키워드 (KR 사이트 전용) ──────────────────────────────
# 테스트 후 영어 키워드(B안)와 결과 수를 비교해 조정 예정
keywords_kr:
  - "국제협력"
  - "국제개발"
  - "정치외교"
  - "공공정책"
  - "외교부"
  - "국제기구"
  - "NGO"
  - "정책연구"
  - "사회과학"
  - "ODA"
  - "인턴"
  - "해외취업"


# ╔══════════════════════════════════════════════════════╗
# ║              📍  근무지 필터 설정                     ║
# ╚══════════════════════════════════════════════════════╝

# ── 영국 근무지 (UK 사이트에 적용) ──────────────────────────────
locations:
  - "United Kingdom"
  - "London"
  - "UK"
  # - "Geneva"   # 추가 예시
  # - "New York" # 추가 예시

# ── 한국 근무지 (KR 사이트에 적용) ──────────────────────────────
locations_kr:
  - "Korea"
  - "Seoul"
  - "서울"
  - "한국"
  # 빈 목록이면 모든 근무지 포함


# ╔══════════════════════════════════════════════════════╗
# ║              ⚙️   기타 설정                          ║
# ╚══════════════════════════════════════════════════════╝

# ── 카테고리 필터 (비워두면 전체) ────────────────────────────────
categories: []

# ── 마감일 필터 (0 = 필터 없음) ─────────────────────────────────
deadline_within_days: 60

# ── 출력 설정 ────────────────────────────────────────────────────
output:
  filename_prefix: "jobs"
  keep_last_days: 30
  timezone: "Asia/Seoul"

# ── 알림 설정 ────────────────────────────────────────────────────
notifications:
  email:
    enabled: false
    to: "your@email.com"
  slack:
    enabled: false
    mention_on_new: true
