# ============================================================
#  Job Crawler — 검색 조건 설정 파일
#  이 파일만 수정하면 크롤링 대상/조건/근무지를 바꿀 수 있습니다.
# ============================================================

# ── 크롤링 대상 사이트 ──────────────────────────────────────
# enabled: false 로 설정하면 해당 사이트는 건너뜁니다.
sites:
  - name: "UN Careers"
    url: "https://careers.un.org"
    crawler: "un_careers"
    enabled: true

  - name: "ReliefWeb"
    url: "https://reliefweb.int/jobs"
    crawler: "reliefweb"
    enabled: true
    note: "UN OCHA 운영, 공개 API 사용 — 빠르고 안정적"

  - name: "Jobs.ac.uk"
    url: "https://www.jobs.ac.uk"
    crawler: "jobs_ac_uk"
    enabled: true
    note: "영국 학술·연구기관 채용 1위"

  - name: "Guardian Jobs"
    url: "https://jobs.theguardian.com"
    crawler: "guardian_jobs"
    enabled: true
    note: "NGO·싱크탱크·공공정책 특화"

  - name: "Prospects.ac.uk"
    url: "https://www.prospects.ac.uk"
    crawler: "prospects"
    enabled: true
    note: "영국 대졸자 1위 취업 포털"

  - name: "Idealist"
    url: "https://www.idealist.org"
    crawler: "idealist"
    enabled: true
    note: "NGO·비영리 인턴십 특화"

  - name: "DevelopmentAid"
    url: "https://www.developmentaid.org/jobs"
    crawler: "development_aid"
    enabled: true
    note: "국제개발·ODA 분야 전문 (무료 공고만 수집)"

  - name: "Civil Service Jobs"
    url: "https://www.civilservicejobs.service.gov.uk"
    crawler: "civil_service_jobs"
    enabled: true
    note: "영국 정부 공식 채용 포털. 일부 포지션 비자 제한 있음"

  - name: "W4MP"
    url: "https://www.w4mp.org"
    crawler: "w4mp"
    enabled: true
    note: "영국 의회·Westminster 특화"

  # ── 제외된 사이트 (이유 기재) ─────────────────────────────
