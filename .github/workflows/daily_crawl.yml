# .github/workflows/daily_crawl.yml
#
# 매일 오전 9시 (KST) 자동 실행됩니다.
# UTC 기준 00:00 = 한국시간 09:00
#
# 필요한 GitHub Secrets (Settings → Secrets and variables → Actions):
#   - GMAIL_USER          : 발송자 Gmail 주소 (알림 사용 시)
#   - GMAIL_APP_PASSWORD  : Gmail 앱 비밀번호  (알림 사용 시)
#   - SLACK_WEBHOOK_URL   : Slack Incoming Webhook URL (알림 사용 시)

name: Daily Job Crawl

on:
  schedule:
    - cron: '0 0 * * *'       # 매일 UTC 00:00 (KST 09:00)
  workflow_dispatch:            # GitHub UI에서 수동 실행 버튼
    inputs:
      dry_run:
        description: 'Dry run (더미 데이터로 테스트)'
        type: boolean
        default: false
      region:
        description: '크롤링 지역 필터 (ALL=전체, UK=영국만, EU=유럽만, KR=한국만)'
        type: choice
        options: ['ALL', 'UK', 'EU', 'KR']
        default: 'ALL'
      kw_test:
        description: '한국어 키워드 테스트 모드 (결과 수 비교만 출력)'
        type: boolean
        default: false

jobs:
  crawl:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write           # docs/ 폴더를 저장소에 커밋하기 위해 필요

    steps:
      # ── 1. 저장소 체크아웃 ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── 2. Python 설치 ──────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. 의존성 설치 ──────────────────────────────────
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # ── 4. 크롤러 실행 ──────────────────────────────────
      - name: Run crawler
        env:
          GMAIL_USER:           ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:   ${{ secrets.GMAIL_APP_PASSWORD }}
          SLACK_WEBHOOK_URL:    ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.region }}" != "" ] && [ "${{ github.event.inputs.region }}" != "ALL" ]; then
            ARGS="$ARGS --region ${{ github.event.inputs.region }}"
          fi
          if [ "${{ github.event.inputs.kw_test }}" = "true" ]; then
            ARGS="$ARGS --kw-test"
          fi
          python main.py $ARGS

      # ── 5. 결과 HTML을 저장소에 커밋 ────────────────────
      - name: Commit output HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/
          git add .seen_jobs.json || true
          git add .seen_jobs_html.json || true
          git diff --staged --quiet || git commit -m "chore: daily job report $(date +'%Y-%m-%d')"
          git push
